server:
  port: 8601

spring:
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: '*'

febs:
  jwt:
    secret: fbdsajkhfkdsahfjkdsahfjkdshfkdsahfjkdshfkdsahfjkdshfkdsahfjkdshfkdsahfjkdshfkdsahfjkdsahfjkdshfkdsahfjkdshf

# LLM配置
llm:
  # 提供商类型：openai / local / mock
  provider: mock

# OpenAI配置
openai:
  api-key: ${OPENAI_API_KEY:your-api-key-here}
  model: ${OPENAI_MODEL:gpt-3.5-turbo}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

# 本地LLM配置（Ollama等）
local:
  llm:
    url: ${LOCAL_LLM_URL:http://localhost:11434}
    model: ${LOCAL_LLM_MODEL:qwen2.5:7b}

logging:
  level:
    cc.mrbird.febs.agent: debug