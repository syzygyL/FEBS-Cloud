server:
  port: 8601

spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/febs_cloud?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
        slave:
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/febs_cloud?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8

# Redis配置
spring.redis:
  host: localhost
  port: 6379
  password: 
  database: 0

# OpenAI配置
openai:
  api-key: your-api-key-here
  model: gpt-3.5-turbo
  base-url: https://api.openai.com/v1

# 日志配置
logging:
  level:
    cc.mrbird.febs.agent: debug
    org.springframework.security: debug
  file:
    path: logs
    name: logs/febs-agent.log